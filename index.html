<script type="module">

const ui={

let audio=null,master=null,musicOn=true,musicT=0,musicStep=0;
function enableAudio(){
 if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.28;master.connect(audio.destination)}
 if(audio.state==='suspended')audio.resume();ui.audio.textContent='AUDIO ON';ui.audio.style.background='#c8ffd5';tone(440,.08,'triangle',.1,150)
}
function tone(f=220,d=.1,type='sine',vol=.08,slide=0){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),audio.currentTime+d);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(master);o.start();o.stop(audio.currentTime+d)}

const snd={touch(){tone(105,.035,'sine',.035,20)},push(){noise(.035,.025)},jump(){tone(150,.08,'square',.065,150)},land(){noise(.055,.045);tone(80,.05,'sine',.04,-20)},tag(){tone(520,.07,'square',.11,250);setTimeout(()=>tone(820,.1,'triangle',.08,150),55)},freeze(){tone(360,.18,'sine',.1,-180)},point(){tone(620,.07,'triangle',.09,250)},button(){tone(420,.04,'square',.05,100)}};

 const notes=sets[currentArea]||sets.hub,n=notes[musicStep%notes.length];
 tone(n,.17,'triangle',.018,0);if(musicStep%4===0)tone(n/2,.24,'sine',.014,0);if(musicStep%8===4)noise(.025,.009);musicStep++
}

const GEO={box:new THREE.BoxGeometry(1,1,1),cyl:new THREE.CylinderGeometry(1,1,1,10),sphere:new THREE.SphereGeometry(1,12,9),plane:new THREE.PlaneGeometry(1,1)};
const materialCache=new Map();
function material(color,rough=.88,metal=0,transparent=false,opacity=1){const k=`${color}_${rough}_${metal}_${transparent}_${opacity}`;if(!materialCache.has(k))materialCache.set(k,new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,transparent,opacity}));return materialCache.get(k)}

const areaGroups={hub:new THREE.Group(),forest:new THREE.Group(),snow:new THREE.Group(),lava:new THREE.Group(),shop:new THREE.Group()};

const portals=[];const slideColliders=[];const boostPads=[];

function addBox(area,pos,size,color,rot=new THREE.Euler(),opt={}){
 const m=new THREE.Mesh(GEO.box,material(color,opt.rough??.88,opt.metal??0,opt.transparent??false,opt.opacity??1));m.position.copy(pos);m.rotation.copy(rot);m.scale.copy(size);m.matrixAutoUpdate=true;areaGroups[area].add(m);m.updateMatrixWorld(true);
 if(opt.collider!==false){const c={type:'box',mesh:m,half:new THREE.Vector3(.5,.5,.5),solid:opt.solid!==false,floor:opt.floor!==false,tag:opt.tag||'',area};syncCollider(c);colliders[area].push(c);if(opt.tag==='slide')slideColliders.push(c)}

}
function addCylinder(area,pos,r,h,color,opt={}){

 if(opt.collider!==false){const c={type:'cylinder',mesh:m,radius:r,halfY:h*.5,solid:opt.solid!==false,floor:opt.floor!==false,tag:opt.tag||'',area};syncCollider(c);colliders[area].push(c)}return m
}

function makeText(text,w=2,h=.5,bg='#132131',fg='#fff',font=44){const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,512,128);x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';const fs=text.length>16?28:text.length>11?34:font;x.font=`800 ${fs}px system-ui`;x.fillText(text,256,64);const t=new THREE.CanvasTexture(c);t.generateMipmaps=false;t.minFilter=THREE.LinearFilter;const m=new THREE.Mesh(GEO.plane,new THREE.MeshBasicMaterial({map:t,transparent:true}));m.scale.set(w,h,1);return m}
function sign(area,text,pos,w=3,h=.7,ry=0,bg='#193148'){const m=makeText(text,w,h,bg);m.position.copy(pos);m.rotation.y=ry;areaGroups[area].add(m);return m}

// COLLISION QUERIES: visible box/cylinder dimensions are the collider
// ------------------------------------------------------------
const V1=new THREE.Vector3(),V2=new THREE.Vector3(),V3=new THREE.Vector3();
function queryBox(point,c){
 const p=V1.copy(point).applyMatrix4(c.inv),h=c.half;
 const q=V2.set(THREE.MathUtils.clamp(p.x,-h.x,h.x),THREE.MathUtils.clamp(p.y,-h.y,h.y),THREE.MathUtils.clamp(p.z,-h.z,h.z));
 const closest=q.clone().applyMatrix4(c.matrix),outside=point.clone().sub(closest);let dist=outside.length(),normal=new THREE.Vector3();

  const scale=c.mesh.scale;
  const dx=(h.x-Math.abs(p.x))*Math.abs(scale.x),dy=(h.y-Math.abs(p.y))*Math.abs(scale.y),dz=(h.z-Math.abs(p.z))*Math.abs(scale.z);
  const nLocal=new THREE.Vector3();
  if(dx<=dy&&dx<=dz){dist=-dx;nLocal.set(Math.sign(p.x)||1,0,0)}else if(dy<=dx&&dy<=dz){dist=-dy;nLocal.set(0,Math.sign(p.y)||1,0)}else{dist=-dz;nLocal.set(0,0,Math.sign(p.z)||1)}
  normal.copy(nLocal).applyMatrix3(c.normalMatrix).normalize();
 }

}
function queryCylinder(point,c){
 const center=new THREE.Vector3().setFromMatrixPosition(c.matrix),dx=point.x-center.x,dz=point.z-center.z,dy=point.y-center.y;
 const radial=Math.hypot(dx,dz),clampedR=Math.min(radial,c.radius),clampedY=THREE.MathUtils.clamp(dy,-c.halfY,c.halfY);
 const closest=new THREE.Vector3(center.x+(radial>1e-6?dx/radial*clampedR:0),center.y+clampedY,center.z+(radial>1e-6?dz/radial*clampedR:0));
 const delta=point.clone().sub(closest);let dist=delta.length(),normal=new THREE.Vector3();
 if(dist>1e-6)normal.copy(delta).normalize();else{const side=c.radius-radial,cap=c.halfY-Math.abs(dy);if(side<=cap){dist=-side;normal.set(dx/(radial||1),0,dz/(radial||1))}else{dist=-cap;normal.set(0,Math.sign(dy)||1,0)}}
 return{distance:dist,normal,point:closest,collider:c}
}
function queryCollider(point,c){return c.type==='box'?queryBox(point,c):queryCylinder(point,c)}
function nearestSurface(point,area,maxDistance=.3,solidOnly=false){let best=null,bestD=1e9;for(const c of colliders[area]){if(solidOnly&&!c.solid)continue;const q=queryCollider(point,c);if(q.distance<bestD&&q.distance<=maxDistance){best=q;bestD=q.distance}}return best}
function boxTopAtXZ(c,x,z){
 const up=new THREE.Vector3(0,1,0).applyMatrix3(c.normalMatrix).normalize();if(up.y<.3)return null;
 const topCenter=new THREE.Vector3(0,c.half.y,0).applyMatrix4(c.matrix);const y=(up.dot(topCenter)-up.x*x-up.z*z)/up.y;const local=new THREE.Vector3(x,y,z).applyMatrix4(c.inv);
 if(Math.abs(local.x)<=c.half.x+.04&&Math.abs(local.z)<=c.half.z+.04&&Math.abs(local.y-c.half.y)<.08)return y;return null
}
function cylinderTopAtXZ(c,x,z){const center=new THREE.Vector3().setFromMatrixPosition(c.matrix);const dx=x-center.x,dz=z-center.z;if(dx*dx+dz*dz<=c.radius*c.radius)return center.y+c.halfY;return null}
function supportAt(x,z,footY,area){let best=-Infinity,bestC=null;for(const c of colliders[area]){if(!c.floor)continue;const y=c.type==='box'?boxTopAtXZ(c,x,z):cylinderTopAtXZ(c,x,z);if(y!==null&&y<=footY+.42&&y>best){best=y;bestC=c}}return bestC?{y:best,collider:bestC}:null}

const spawn={hub:new THREE.Vector3(0,0,10),forest:new THREE.Vector3(0,0,25),snow:new THREE.Vector3(0,0,27),lava:new THREE.Vector3(0,0,28),shop:new THREE.Vector3(0,0,7)};

function addPortal(area,name,pos,target,color){const ring=new THREE.Mesh(new THREE.TorusGeometry(1.35,.18,8,22),material(color,.35,.15));ring.position.copy(pos);areaGroups[area].add(ring);sign(area,name,pos.clone().add(new THREE.Vector3(0,2.1,0)),2.4,.55,0,'#172434');portals.push({area,pos:pos.clone(),target,cool:0})}

// HUB
addBox('hub',new THREE.Vector3(0,-.5,0),new THREE.Vector3(50,1,50),0x58a64f);boundaries('hub',50,6,0x52665a);sign('hub','PRIMAL PLAYGROUND',new THREE.Vector3(0,4,-10),4.5,.8,0,'#214b31');

for(const [x,y,z] of [[-6,1.0,5],[-4,2.1,3],[-2,3.1,1],[5,1.2,-2],[7,2.4,-4],[9,3.6,-6]])addBox('forest',new THREE.Vector3(x,y,z),new THREE.Vector3(2.2,.45,2.2),0x9a744b);

addBox('forest',new THREE.Vector3(-3.2,4,-18),new THREE.Vector3(.8,8,19),0x74665b);addBox('forest',new THREE.Vector3(3.2,4,-18),new THREE.Vector3(.8,8,19),0x74665b);addBox('forest',new THREE.Vector3(0,8,-25),new THREE.Vector3(7,.6,5),0xa27a4c);

beam('forest',new THREE.Vector3(-20,3,10),new THREE.Vector3(-8,5,5));beam('forest',new THREE.Vector3(-8,5,5),new THREE.Vector3(0,5,0));beam('forest',new THREE.Vector3(0,5,0),new THREE.Vector3(11,6,8));beam('forest',new THREE.Vector3(11,6,8),new THREE.Vector3(22,4,13));

addBox('snow',new THREE.Vector3(0,-.5,0),new THREE.Vector3(72,1,72),0xeaf7ff);boundaries('snow',72,8,0xb9d9ea);sign('snow','SNOW SLIDES',new THREE.Vector3(0,7,-32),4,.7,0,'#31516d');

function toggleMenu(force){menuOpen=force===undefined?!menuOpen:force;menu.visible=menuOpen;if(menuOpen){const p=new THREE.Vector3(),q=new THREE.Quaternion();camera.getWorldPosition(p);camera.getWorldQuaternion(q);const f=new THREE.Vector3(0,0,-1).applyQuaternion(q);menu.position.copy(p).addScaledVector(f,1.05);menu.position.y-=.12;menu.quaternion.copy(q);say('Menu opened',.8)}snd.button()}
function updateMenu(dt){for(const b of menuButtons)b.cool=Math.max(0,b.cool-dt);if(!menuOpen)return;for(const h of hands)for(const b of menuButtons){const box=new THREE.Box3().setFromObject(b.mesh).expandByScalar(.06);if(b.cool<=0&&box.containsPoint(h.world)){b.cool=.55;b.action();snd.button();return}}}
function pollX(){if(!renderer.xr.isPresenting)return;const session=renderer.xr.getSession();let pressed=false;for(const src of session.inputSources){if(src.handedness!=='left'||!src.gamepad)continue;const b=src.gamepad.buttons;pressed=!!(b[4]?.pressed||b[3]?.pressed)}if(pressed&&!menuDebounce)toggleMenu();menuDebounce=pressed}

// ------------------------------------------------------------
// AREA / MODE / PORTALS
// ------------------------------------------------------------
function setAreaVisible(name){for(const [k,g] of Object.entries(areaGroups))g.visible=k===name;mirrorProxy.root.visible=name==='shop'}
function teleport(name,silent=false){currentArea=name;setAreaVisible(name);rig.position.copy(spawn[name]);velocity.set(0,0,0);for(const h of hands)h.ready=false;toggleMenu(false);if(!silent)say(`Entered ${name.toUpperCase()}`,1.2);refreshUI()}
function setMode(mode){gameMode=mode;resetModeActors();toggleMenu(false);say(mode==='casual'?'Casual: no tagger.':mode==='infection'?'Infection started.':'Ice Tag started.',1.5)}
function refreshUI(){ui.map.textContent=currentArea[0].toUpperCase()+currentArea.slice(1);ui.mode.textContent=gameMode==='icetag'?'Ice Tag':gameMode[0].toUpperCase()+gameMode.slice(1);ui.role.textContent=playerLava?'Lava Monkey':playerIce?'Ice Tagger':'Normal';ui.points.textContent=points}
function updatePortals(dt){const head=new THREE.Vector3();camera.getWorldPosition(head);for(const p of portals){p.cool=Math.max(0,p.cool-dt);if(p.area===currentArea&&p.cool<=0&&head.distanceTo(p.pos)<1.35){p.cool=1;teleport(p.target)}}}

// ------------------------------------------------------------
// XR SESSION
// ------------------------------------------------------------
renderer.xr.addEventListener('sessionstart',()=>{enableAudio();ui.cross.style.display='none';camera.position.set(0,0,0);teleport('hub',true);for(const h of hands){h.ready=false;h.hand.visible=true}say('VR ready. Push the ground — no calibration room.',2.5)});
renderer.xr.addEventListener('sessionend',()=>{ui.cross.style.display='';camera.position.set(0,1.65,4);for(const h of hands)h.hand.visible=false;for(const a of armMeshes){a.upper.visible=a.lower.visible=false}score.visible=false});

// ------------------------------------------------------------
// MAIN LOOP
// ------------------------------------------------------------
window.addEventListener('error',e=>{console.error(e.error||e.message);say('A script error was caught. Returning to Hub.',3)});window.addEventListener('unhandledrejection',e=>{console.error(e.reason);say('A browser error was caught.',3)});
setAreaVisible('hub');refreshUI();resetModeActors();
const clock=new THREE.Clock();let aiAccum=0;
renderer.setAnimationLoop(()=>{
 const dt=Math.min(clock.getDelta(),.033);if(msgTime>0){msgTime-=dt;if(msgTime<=0)ui.msg.textContent=''}
 pollX();if(renderer.xr.isPresenting)updateLocomotion(dt);else updateDesktop(dt);checkPlayerTags();updatePlayerVisual();updateScorePosition();updateMenu(dt);updatePortals(dt);updateMirror();
 aiAccum+=dt;if(aiAccum>=.033){updateNPCs(aiAccum);aiAccum=0}updateMusic(dt);refreshUI();renderer.render(scene,camera)
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
